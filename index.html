<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF6F0">
<title>Noshnama</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/outfit-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css?v=1.2.3">
</head>
<body>

<div id="curtain" class="curtain" hidden></div>
<div id="welcome" class="curtain" hidden></div>

<div id="app" class="app" hidden>
  <header class="top">
    <div class="brand">Noshnama</div>
    <button id="pill" class="pill" data-act="pill" type="button"></button>
  </header>
  <main>
    <div id="viewToday"></div>
    <div id="viewStats" hidden></div>
    <div id="viewFoods" hidden></div>
  </main>
  <nav class="tabs" aria-label="Sections">
    <div class="tab-group">
      <button type="button" class="tab" data-act="tab" data-tab="today"><span class="tab-ico" data-ico="today"></span><span>Today</span></button>
      <button type="button" class="tab" data-act="tab" data-tab="foods"><span class="tab-ico" data-ico="foods"></span><span>Foods</span></button>
    </div>
    <button type="button" class="fab" data-act="fab" aria-label="Add"><span data-ico="plus"></span></button>
    <div class="tab-group">
      <button type="button" class="tab" data-act="tab" data-tab="stats"><span class="tab-ico" data-ico="stats"></span><span>Stats</span></button>
      <button type="button" class="tab" data-act="settings"><span class="tab-ico" data-ico="settings"></span><span>Settings</span></button>
    </div>
  </nav>
</div>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="backdrop" data-act="sheet-close"></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="sheet-x iconbtn" data-act="sheet-close" type="button" aria-label="Close"><span data-ico="close"></span></button>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<noscript><p style="padding:24px;font-family:system-ui">Please turn on JavaScript to use Noshnama.</p></noscript>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="logic.js?v=1.2.3"></script>
<script src="icons.js?v=1.2.3"></script>
<script src="app.js?v=1.2.3"></script>
</body>
</html>
